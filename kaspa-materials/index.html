<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>SHA-256 bitová statistika + PoW</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
      }

      .panel {
        background: white;
        padding: 26px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.12);
        font-size: 1.15em;
      }

      label {
        display: inline-block;
        width: 360px;
      }

      input {
        width: 200px;
        font-size: 1.05em;
        padding: 4px;
      }

      button {
        margin-top: 16px;
        padding: 12px 24px;
        cursor: pointer;
        font-size: 1.1em;
      }

      #stats {
        margin-top: 20px;
        line-height: 1.7em;
        font-size: 1.05em;
      }

      canvas {
        background: white;
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <h2>SHA-256 – bitová statistika (PoW + pravděpodobnost)</h2>

      <div>
        <label>Počet hashů:</label>
        <input id="count" type="number" value="10000" min="1" />
      </div>

      <br />

      <div>
        <label>Obtížnost (binární nuly 0–256):</label>
        <input id="difficulty" type="number" value="0" min="0" max="256" />
      </div>

      <br />

      <div id="probBox"></div>

      <br />

      <button onclick="run()">Spustit</button>

      <div id="stats"></div>
    </div>

    <canvas id="chart" height="120"></canvas>

    <script>
      const BIT_COUNT = 256;
      let chart = null;

      function updateProbability() {
        const d = Number(document.getElementById('difficulty').value);

        const probability = 1 / Math.pow(2, d);

        document.getElementById('probBox').innerHTML =
          `<b>Vzorec:</b> P = 1 / 2^${d}<br>` +
          `<b>Výpočet:</b> 2^${d} = ${Math.pow(2, d).toLocaleString()}<br>` +
          `<b>Pravděpodobnost:</b> ${probability}`;
      }

      document
        .getElementById('difficulty')
        .addEventListener('input', updateProbability);

      updateProbability();

      function randomUint32() {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        return array[0];
      }

      async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return new Uint8Array(hashBuffer);
      }

      async function run() {
        const count = Number(document.getElementById('count').value);

        const difficulty = Number(document.getElementById('difficulty').value);

        const TARGET = 1n << BigInt(256 - difficulty);

        const bitCounts = new Array(BIT_COUNT).fill(0);

        let found = 0;

        const start = performance.now();

        for (let i = 0; i < count; i++) {
          const rnd = randomUint32();
          const hashBytes = await sha256(rnd.toString());

          const hashValue = BigInt(
            '0x' +
              Array.from(hashBytes)
                .map((b) => b.toString(16).padStart(2, '0'))
                .join(''),
          );

          if (hashValue < TARGET) {
            found++;

            for (let byteIndex = 0; byteIndex < 32; byteIndex++) {
              const byte = hashBytes[byteIndex];

              for (let bit = 0; bit < 8; bit++) {
                const bitValue = (byte >> (7 - bit)) & 1;

                const globalBitIndex = byteIndex * 8 + bit;

                if (bitValue === 1) {
                  bitCounts[globalBitIndex]++;
                }
              }
            }
          }
        }

        const elapsed = ((performance.now() - start) / 1000).toFixed(2);

        document.getElementById('stats').innerHTML =
          '<b>Validní hashy:</b> ' +
          found +
          '<br>' +
          '<b>Doba výpočtu:</b> ' +
          elapsed +
          ' s<br>' +
          '<b>Úspěšnost:</b> ' +
          ((100 * found) / count).toFixed(5) +
          ' %';

        drawChart(bitCounts);
      }

      function drawChart(values) {
        const labels = [];

        for (let i = 0; i < BIT_COUNT; i++) {
          labels.push(i.toString());
        }

        const safeValues = values.map((v) => (v === 0 ? 0.1 : v));

        if (chart) chart.destroy();

        chart = new Chart(document.getElementById('chart'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Výskyt bitu = 1 (PoW filtrované, log Y)',
                data: safeValues,
              },
            ],
          },
          options: {
            responsive: true,
            scales: {
              y: {
                type: 'logarithmic',
                min: 1,
                max: 10000,
                title: {
                  display: true,
                  text: 'Počet výskytů (log škála)',
                },
              },
              x: {
                title: {
                  display: true,
                  text: 'Index bitu (0 = MSB, 255 = LSB)',
                },
                ticks: {
                  maxTicksLimit: 16,
                },
              },
            },
          },
        });
      }
    </script>
  </body>
</html>
